services:
  - type: web
    name: omega-mesh-console
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GROK_PROJECT_ID
        value: omega-mesh-console
